name: ci

on:
  push:
  pull_request:

jobs:
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Check headers & authorship
        run: |
          python tools/check_headers.py

  validate_traces:
    runs-on: ubuntu-latest
    needs: [headers]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Generate example run
        run: |
          mkdir -p .rok/traces
          rok run --task "synthetic: assumptions + constraints" --out .rok/traces/example.jsonl
      - name: Validate traces (strict)
        run: |
          rok validate --strict --schema-version v1 .rok/traces
      - name: Replay (pinned)
        run: |
          rok replay --schema-version v1 --json .rok/traces > replay.json
          rok replay --schema-version v1 --jsonl .rok/traces > replay.jsonl

  readme_pyproject:
    runs-on: ubuntu-latest
    needs: [headers]
    steps:
      - uses: actions/checkout@v4
      - name: Validate README and pyproject authorship
        run: |
          python - <<'PY'
          from pathlib import Path
          repo = Path('.').resolve()
          auth_line = "Authorship invariant: Frazer Σ Love · Sara ΣΩ"
          readme = (repo / "README.md").read_text(encoding="utf-8", errors="replace")
          assert auth_line in readme, "README missing required authorship line"
          pyproj = (repo / "pyproject.toml").read_text(encoding="utf-8", errors="replace")
          assert "Frazer Σ Love" in pyproj and "Sara ΣΩ" in pyproj, "pyproject missing required authors"
          assert "Copyright" in readme and "2026" in readme, "README missing copyright line mentioning 2026"
          print("README/pyproject checks: OK")
          PY
