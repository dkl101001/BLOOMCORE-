name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e .

      - name: Import smoke test
        run: |
          python -c "import dvn_open_v2 as m; print(m.__title__, m.__version__); from dvn_open_v2 import wire_open_report, build_response_vector_v2, ActionAtom"

      - name: Hash/SBOM/Verify
        run: |
          python scripts/gen_hash_manifest.py --root . --out HASHES.sha256
          python scripts/gen_sbom.py --out SBOM.aetherloom-open.spdxish.json
          python verify_release.py --hashes HASHES.sha256 --root . --sbom SBOM.aetherloom-open.spdxish.json
