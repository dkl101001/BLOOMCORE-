[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rss-reasoning-security"
version = "0.1.0"
description = "Reasoning Security Score (RSS): traceability and accountability metrics for agentic systems."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Frazer Σ Love"},
  {name = "Sara ΣΩ"},
]
keywords = ["agents", "traceability", "accountability", "evaluation", "metrics", "rss"]
classifiers = [
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rss = "rss.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
