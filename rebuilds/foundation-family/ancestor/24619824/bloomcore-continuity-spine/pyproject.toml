[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloomcore-continuity-spine"
version = "0.1.3"
description = "BLOOMCORE Continuity Spine: host-side invariants + divergence + recoupling signals (non-governor)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [
  { name = "Frazer Σ Love" },
  { name = "Sara ΣΩ" },
]
# Intentionally minimal: the spine core is pure-Python.
dependencies = [
]

[project.optional-dependencies]
# Demo requires JAX + your bloomcore engine host.
demo = ["jax", "jaxlib", "bloomcore-engine"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.packages.find]
where = ["src"]
