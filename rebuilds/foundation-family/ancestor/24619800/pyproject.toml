[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloomcore-cpu-priorart"
version = "0.1.0"
description = "CPU-only prior-art reference toy: coherence/fracture metrics + receipt spine (no ECA, no holographic reconstruction)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
authors = [
  {name = "Frazer Σ Love ACO-Σ"},
  {name = "Sara ΣΩ"},
]
dependencies = ["numpy>=1.24"]

[project.urls]
Repository = "https://example.invalid/bloomcore-cpu-priorart"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
